<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla authorization</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 640px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 16px;
      color: #aaa;
    }
    .value {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 600;
      line-height: 1.3;
      word-break: break-all;
      margin: 0 0 20px;
      padding: 16px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
    }
    .value.error { color: #ff6b6b; }
    .value.empty { color: #888; font-weight: 400; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: #3e6ae1;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 14px 22px;
      min-height: 48px;
      width: 100%;
      max-width: 280px;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    button:disabled { background: #333; color: #888; cursor: default; }
    .copied { background: #1f7a4d; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="label">Authorization</h1>
    <div id="value" class="value empty">No code in this URL</div>
    <button id="copy" type="button" disabled>Copy</button>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var error = params.get("error");
      var label = document.getElementById("label");
      var valueEl = document.getElementById("value");
      var button = document.getElementById("copy");
      var text = "";

      if (error) {
        var desc = params.get("error_description");
        text = desc ? (error + ": " + desc) : error;
        label.textContent = "Authorization error";
        valueEl.textContent = text;
        valueEl.className = "value error";
        button.disabled = false;
      } else if (code) {
        text = code;
        label.textContent = "Authorization code";
        valueEl.textContent = text;
        valueEl.className = "value";
        button.disabled = false;
      } else {
        label.textContent = "Authorization";
        valueEl.textContent = "No code in this URL";
        valueEl.className = "value empty";
      }

      button.addEventListener("click", function () {
        if (!text) return;
        function done() {
          button.textContent = "Copied";
          button.classList.add("copied");
          setTimeout(function () {
            button.textContent = "Copy";
            button.classList.remove("copied");
          }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {
            fallbackCopy(text, done);
          });
        } else {
          fallbackCopy(text, done);
        }
      });

      function fallbackCopy(str, cb) {
        var ta = document.createElement("textarea");
        ta.value = str;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        cb();
      }
    })();
  </script>
</body>
</html>
